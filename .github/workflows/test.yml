# Every push to main and every pull request: types, lint, the full Vitest suite on both
# platforms, and the Python suite. The Windows leg catches line-ending and path-separator
# problems; the Python leg is the one that matters most here, because it runs the leakage
# and purge tests against the committed artifacts.
#
# Activated 2026-11-22. It was parked at `ci/test.yml` because the `gh` token lacked the
# `workflow` scope; the file was always correct, it just could not be written here.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test

  # The ML service: the leakage and purge tests, run against the committed panel and
  # artifacts. This is the leg that would catch a change to features.py reintroducing
  # look-ahead, or a retrain whose artifact no longer loads in a fresh process — both of
  # which happened during the build and neither of which the TypeScript suite can see.
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e "./ml[dev]"
      - name: Lint
        run: python -m ruff check ml/src ml/tests
      - name: Tests
        run: python -m pytest ml -q
      - name: Artifacts are committed and complete
        # A clone that is missing an artifact is a clone that cannot run. The old project
        # had an untracked `rag/` that `main.py` imported, so a fresh clone died at import.
        run: |
          for f in model.pkl calibrator.pkl metrics.json latest_signals.json \
                   feature_importance.json holdout_ledger.json; do
            test -s "ml/artifacts/$f" || { echo "missing ml/artifacts/$f"; exit 1; }
          done
          test -s ml/data/processed/panel.parquet || { echo "missing panel.parquet"; exit 1; }

  # The browser smoke test (tests/e2e/): one journey through the deterministic core against
  # a throwaway Postgres, with the model key invalid on purpose. Ubuntu only — it needs a
  # service container and a browser, and the Windows leg above already covers portability.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # pgvector, not plain postgres: the first migration runs
        # `create extension if not exists vector` and stock postgres:16 does not
        # ship it, so Migrate died before the smoke test ever started. Locally
        # this never showed up because PGlite loads pgvector in-process.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Migrate
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      - name: Smoke test
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
          AUTH_SECRET: ci-smoke-secret
          CI: "true"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
